name: Release

# Stages a release of the `ai-scaffolder` npm package when a version tag is pushed:
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# Nothing becomes public by itself. npm holds the staged version until a maintainer approves it with their
# 2FA (npmjs.com -> the package -> "Staged Packages" -> Approve). Trusted publishing (OIDC) can stage but
# cannot approve, and there is no npm token in this repository.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publisher -> GitHub Actions):
#     Organization or user: Blueray-Automation    Repository: Scaffolder    Workflow filename: release.yml
#     Allowed actions: `npm stage publish` only (leave `npm publish` off)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check the tag, run every check, build the package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the tag name is untrusted input: it reaches the shell through an environment variable, never through ${{ }} in the script
      - name: The tag is a version and the commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: merge the change first, then tag the merge commit"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: Build the package at the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm run build:cli -- --version "${TAG#v}"
          cat dist/cli/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-scaffolder-package
          path: dist/cli
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage the package on npm (a maintainer approves it there)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the only job that can obtain an npm identity, and it runs nothing from the repository: just the package built above
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-scaffolder-package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # trusted publishing needs npm 11.5.1+ and staging 11.15.0+; the npm that ships with Node 22 is older
      - run: npm install --global npm@11
      - name: Stage it
        working-directory: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # a pre-release must not become `latest`
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          npm --version
          npm stage publish --access public --tag "$tag"
